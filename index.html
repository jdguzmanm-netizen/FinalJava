<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería accesible - Proyecto final</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido principal</a>

  <header>
    <h1>Juegos PS5</h1>

  <main id="contenido">

      </figure>

      <figure>
        <img src="imagenes/foto2.jpg" alt="Descripción de la imagen 2" width="400" height="300">

      </figure>

      <figure>
        <img src="imagenes/foto3.jpg" alt="Descripción de la imagen 3" width="400" height="300">
        <figcaption>GTA IV</figcaption>
      </figure>

      <figure>
        <img src="imagenes/foto4.jpg" alt="Descripción de la imagen 4" width="400" height="300">
        <figcaption>FC 27</figcaption>
      </figure>

      <figure>
        <img src="imagenes/foto5.jpg" alt="Descripción de la imagen 5" width="400" height="300">
        <figcaption>Resident Evil Requiem</figcaption>
      </figure>

      <figure>
        <img src="imagenes/foto6.jpg" alt="Descripción de la imagen 6" width="400" height="300">
        <figcaption>MK 1</figcaption>

  <footer>
    <p>Proyecto final del curso de JavaScript.</p>
  </footer>

  <script src="script.js"></script>

</html>
